---

stages:
  - lint
  - molecule

ansible:
  stage: lint
  needs: []
  image: registry.cri.epita.fr/cri/docker/ansible/master
  script:
    - ansible-lint

yaml:
  stage: lint
  needs: []
  image: registry.cri.epita.fr/cri/docker/ansible/master
  script:
    - yamllint -f colored .

molecule:
  stage: molecule
  needs: []
  image: quay.io/ansible/molecule:latest
  tags:
    - docker
  variables:
    PY_COLORS: 1
  script:
    - molecule test
